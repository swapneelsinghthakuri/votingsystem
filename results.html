<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Results - VoteNation</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M9 11l3 3L22 4"></path>
                    <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
                </svg>
                <span class="brand-text">VoteNation</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Vote</a>
                <a href="results.html" class="nav-link active">Results</a>
                <a href="admin-login.html" class="nav-link">Admin</a>
            </div>
        </div>
    </nav>

    <!-- Results Hero -->
    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Live Results</h1>
            <p class="hero-subtitle">Real-time voting statistics and standings</p>
        </div>
    </section>

    <!-- Results Dashboard -->
    <section class="results-section">
        <div class="container">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"></path>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Total Votes</div>
                        <div class="stat-value" id="totalVotes">0</div>
                    </div>
                </div>

                <div class="stat-card highlight">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Leading Party</div>
                        <div class="stat-value small" id="leadingParty">-</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M18 20V10M12 20V4M6 20v-6"></path>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-label">Participation</div>
                        <div class="stat-value" id="participation">0%</div>
                    </div>
                </div>
            </div>

            <!-- Chart -->
            <div class="chart-container">
                <div class="chart-header">
                    <h2 class="chart-title">Vote Distribution</h2>
                    <div class="chart-legend" id="chartLegend"></div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="votesChart"></canvas>
                </div>
            </div>

            <!-- Rankings Table -->
            <div class="rankings-container">
                <h2 class="section-title">Party Rankings</h2>
                <div class="rankings-grid" id="rankingsGrid">
                    <!-- Rankings will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-text">© Voting Management System | Design By Swapneel Singh Thakuri</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Initialize results page
        if (typeof initResults === 'function') {
            initResults();
        }
    </script>
</body>
</html>
